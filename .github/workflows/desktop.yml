name: Desktop

# Unit tests on every change to the desktop app. Installers (Windows, macOS, Linux) are built on demand:
# run this workflow by hand (Actions → Desktop → Run workflow) or push a tag like desktop-v0.1.0.
on:
  push:
    branches: [main, backlot-desktop]
    paths: [desktop/**, .github/workflows/desktop.yml]
    tags: ["desktop-v*"]
  pull_request:
    paths: [desktop/**, .github/workflows/desktop.yml]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: desktop } }
    env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm test

  installers:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'pull_request' && github.base_ref == 'backlot-desktop')
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/prepare.mjs
      - run: npm run test:database
        if: runner.os != 'Windows'
      - name: Database recovery, demo startup and film export as a Windows standard user
        if: runner.os == 'Windows'
        run: ./scripts/windows-smoke.ps1
        shell: pwsh
      - run: npx electron-builder --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" } # unsigned builds; see docs/DESKTOP.md
      - uses: actions/upload-artifact@v5
        with:
          name: backlot-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
          if-no-files-found: error

